[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "mpl_lego"
version = "0.0.4"
authors = [
    { name = "Pratik Sachdeva", email = "pratik.sachdeva@berkeley.edu" },
]
description = "Extra tools and functions for matplotlib"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["matplotlib", "data visualization", "plotting"]
dependencies = [
    "matplotlib",
    "numpy",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/pssachdeva/mpl-lego"
Repository = "https://github.com/pssachdeva/mpl-lego.git"
Issues = "https://github.com/pssachdeva/mpl-lego/issues"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
